name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Configure git (for tests)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - name: Verify formatting
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # G204 (subprocess launched with variable args) is excluded because gito is a
      # git-wrapper CLI that execs `git` with internally-constructed, ref-validated
      # arguments (see internal/git/validate.go). gosec cannot prove those calls safe,
      # so the rule is a systemic false positive here; all other rules stay active.
      - name: Security scan (gosec)
        uses: securego/gosec@v2.22.9
        with:
          args: '-exclude=G204 ./...'
