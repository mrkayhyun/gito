name: 🐛 Bug report
description: Something in gito behaves incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report.

        **If this is a security problem, stop here** and use
        [private reporting](https://github.com/mrkayhyun/gito/security/advisories/new)
        instead — see [SECURITY.md](https://github.com/mrkayhyun/gito/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did gito do, and what did you expect instead?
      placeholder: |
        I pressed `d` on a stash entry and it dropped a different entry than the
        one highlighted. I expected it to drop the highlighted one.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: >-
        The exact keystrokes, and the repository state that matters. If a
        specific branch name, tag, or file path triggers it, include it
        verbatim — gito validates ref names, so the exact string is often the
        whole story.
      placeholder: |
        1. In a repo with 3 stashes, run `gito stash`
        2. Press `j` twice
        3. Press `d`, then `y`
    validations:
      required: true

  - type: dropdown
    id: command
    attributes:
      label: Which command
      options:
        - menu (launcher)
        - status
        - commit
        - log
        - branch
        - stash
        - tag
        - remote
        - diff
        - reflog
        - blame
        - other / not command-specific
    validations:
      required: true

  - type: input
    id: gito-version
    attributes:
      label: gito version
      description: Output of `gito version`
      placeholder: v1.1.0
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: OS, architecture, and terminal
      placeholder: macOS 15.1 arm64, Ghostty 1.0
    validations:
      required: true

  - type: input
    id: git-version
    attributes:
      label: git version
      description: Output of `git --version`
      placeholder: git version 2.47.0
    validations:
      required: true

  - type: input
    id: locale
    attributes:
      label: Locale
      description: >-
        Output of `echo $LANG`. Relevant for anything involving text rendering,
        alignment, or translated strings.
      placeholder: en_US.UTF-8
    validations:
      required: false

  - type: textarea
    id: output
    attributes:
      label: Error output or screenshot
      description: >-
        Paste any error text, or attach a screenshot if the problem is visual
        (layout, colors, truncation). This is rendered as a code block, so no
        backticks needed.
      render: shell
    validations:
      required: false
